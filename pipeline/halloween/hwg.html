<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="file:///home/claude/ola-social-posts/pipeline/assets/fonts/bricolage-grotesque/700.css">
<link rel="stylesheet" href="file:///home/claude/ola-social-posts/pipeline/assets/fonts/ibm-plex-sans/400.css">
<link rel="stylesheet" href="file:///home/claude/ola-social-posts/pipeline/assets/fonts/ibm-plex-sans/600.css">
<style>
html,body{margin:0;background:#060D18;width:1080px;height:1920px;overflow:hidden}
canvas{display:block}
#warm{position:absolute;left:-9999px;font-family:"Bricolage Grotesque"}#warm b{font-family:"IBM Plex Sans"}
</style></head><body><canvas id="c" width="1080" height="1920"></canvas>
<div id="warm">Ăă Șș Țț îâ<b>Ăă Șș Țț</b></div>
<script>
const W=1080,H=1920, cv=document.getElementById('c'), g=cv.getContext('2d');
const INK='#060D18', CREAM='#F4EFE4', BRASS='#D6A949', BRASS2='#F2CF7A',
      EMBER='#FF8A3D', MUTED='#8E9AB5', GREEN='#25D366';
const TOTAL=__TOTAL__, BEATS=__BEATS__, END=__END__;

const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const prog=(t,s,d)=>clamp((t-s)/d);
const ease=x=>1-Math.pow(1-x,3);
const back=x=>{const c=1.70158+1;return 1+c*Math.pow(x-1,3)+1.70158*Math.pow(x-1,2)};
function glow(c,b){g.shadowColor=c;g.shadowBlur=b}
function noglow(){g.shadowBlur=0;g.shadowColor='transparent'}

// deterministic pseudo-random so every frame of the same t is identical
function rnd(i){const x=Math.sin(i*127.1+i*i*311.7)*43758.5453;return x-Math.floor(x)}

// ---- background: ink field + flickering candle glow from below ----
function flicker(t){
  // layered slow sines -> organic candle wobble, never fully dark
  return 0.78 + 0.10*Math.sin(t*5.3) + 0.07*Math.sin(t*11.7+1.3) + 0.05*Math.sin(t*19.1+2.9);
}
const PX=540, PY=1540;            // pumpkin centre
function background(t){
  g.fillStyle=INK; g.fillRect(0,0,W,H);
  const f=flicker(t);
  // the light the lantern throws: a tall warm pool the copy sits inside
  const rg=g.createRadialGradient(PX,PY-150,60,PX,PY-150,1180*f);
  rg.addColorStop(0,  'rgba(126,160,230,'+(0.26*f).toFixed(3)+')');
  rg.addColorStop(.28,'rgba(110,140,205,'+(0.13*f).toFixed(3)+')');
  rg.addColorStop(.60,'rgba(150,170,215,'+(0.06*f).toFixed(3)+')');
  rg.addColorStop(1,  'rgba(6,13,24,0)');
  g.fillStyle=rg; g.fillRect(0,0,W,H);
  // cool rim light top-left so the frame isn't one flat wash
  const rg2=g.createRadialGradient(150,230,20,150,230,980);
  rg2.addColorStop(0,'rgba(92,124,196,.17)');
  rg2.addColorStop(1,'rgba(6,13,24,0)');
  g.fillStyle=rg2; g.fillRect(0,0,W,H);
  // ground pool under the lantern — elliptical, so it has no hard edge
  g.save(); g.translate(PX,PY+128); g.scale(1,0.26);
  const fl=g.createRadialGradient(0,0,10,0,0,620);
  fl.addColorStop(0,'rgba(150,180,240,'+(0.18*f).toFixed(3)+')');
  fl.addColorStop(.5,'rgba(130,155,205,'+(0.07*f).toFixed(3)+')');
  fl.addColorStop(1,'rgba(6,13,24,0)');
  g.fillStyle=fl; g.beginPath(); g.arc(0,0,620,0,7); g.fill(); g.restore();
}

// ---- three drifting ghosts ----
// Each fades in at its own time so the copy and the art arrive together.
const GHOSTS=__GHOSTS__;
function ghostPath(w,h){
  // dome on top, scalloped hem at the bottom
  g.beginPath();
  g.moveTo(-w,h*0.42);
  g.bezierCurveTo(-w,-h, w,-h, w,h*0.42);
  const n=4, step=(2*w)/n;
  for(let i=0;i<n;i++){
    const x0=w-i*step, xm=x0-step/2, x1=x0-step;
    const dip=(i%2===0)? h*0.30 : h*0.16;
    g.quadraticCurveTo(xm,h*0.42+dip,x1,h*0.42);
  }
  g.closePath();
}
function ghost(gh,t){
  const outAt=(gh.until===undefined?1e9:gh.until);
  const a=ease(clamp((t-gh.at)/0.8))*(1-ease(clamp((t-outAt)/0.9)));
  if(a<=0.01)return;
  const bob=Math.sin(t*1.25+gh.ph)*14, sway=Math.sin(t*0.62+gh.ph)*18;
  g.save(); g.globalAlpha=a;
  g.translate(gh.x+sway,gh.y+bob); g.scale(gh.s,gh.s);
  const w=118,h=150;
  // halo
  const halo=g.createRadialGradient(0,-10,20,0,-10,300);
  halo.addColorStop(0,'rgba(190,215,255,.26)');
  halo.addColorStop(1,'rgba(190,215,255,0)');
  g.fillStyle=halo; g.beginPath(); g.arc(0,-10,300,0,7); g.fill();
  // body
  const bg=g.createLinearGradient(0,-h,0,h*0.75);
  bg.addColorStop(0,'rgba(236,243,255,.95)');
  bg.addColorStop(.62,'rgba(198,214,240,.80)');
  bg.addColorStop(1,'rgba(150,172,210,.30)');
  glow('rgba(190,215,255,.45)',34);
  g.fillStyle=bg; ghostPath(w,h); g.fill(); noglow();
  // face
  g.fillStyle='rgba(12,20,38,.88)';
  g.beginPath(); g.ellipse(-40,-34,17,25,0,0,7); g.fill();
  g.beginPath(); g.ellipse( 40,-34,17,25,0,0,7); g.fill();
  g.beginPath(); g.ellipse(0,34,22,27,0,0,7); g.fill();
  g.restore();
}
function ghostScene(t){ GHOSTS.forEach(gh=>ghost(gh,t)); }

// ---- drifting embers, rising out of the lantern ----
const NEMB=78;
function embers(t){
  g.save();
  for(let i=0;i<NEMB;i++){
    const sp=0.13+rnd(i)*0.26;                 // rise speed
    const life=(t*sp + rnd(i+99))%1;           // 0..1 lantern -> top
    // emit from a band around the lantern, widening as they rise
    const spread=120+life*620;
    const x=PX+(rnd(i+7)*2-1)*spread + Math.sin(t*(0.5+rnd(i+31)*0.9)+i)*40;
    const y=(PY-60)-life*(PY+120);
    const rad=1.8+rnd(i+53)*4.2;
    const a=Math.sin(Math.PI*Math.pow(life,0.75))*(0.34+rnd(i+71)*0.46);
    if(a<=0.01)continue;
    const warm=rnd(i+17)>0.58;
    g.globalAlpha=a;
    g.fillStyle = warm ? '#DCE7FF' : '#9FB8E8';
    glow(warm?'rgba(220,231,255,.6)':'rgba(159,184,232,.6)', 16);
    g.beginPath(); g.arc(x,y,rad,0,7); g.fill();
  }
  noglow(); g.restore();
}

// ---- vignette ----
function vignette(){
  const v=g.createRadialGradient(W/2,H*0.46,420,W/2,H*0.46,1180);
  v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,0,.62)');
  g.fillStyle=v; g.fillRect(0,0,W,H);
}

function layout(txt,font,maxW){
  g.font=font; const words=txt.split(' '); const lines=[]; let cur='';
  for(const w of words){const test=cur?cur+' '+w:w;
    if(g.measureText(test).width>maxW&&cur){lines.push(cur);cur=w}else cur=test}
  if(cur)lines.push(cur); return lines;
}

function drawBeat(b,t){
  const a=ease(prog(t,b.in,0.42))*(1-ease(prog(t,b.out,0.34)));
  if(a<=0.001)return;
  const rise=(1-ease(prog(t,b.in,0.62)))*30;
  const size=b.size||74, lh=size*1.24, font=`700 ${size}px "Bricolage Grotesque"`;
  const lines=layout(b.text,font,860);
  const blockH=lines.length*lh;
  const y0=880-blockH/2+rise;
  const col=b.ember?EMBER:BRASS2;
  const shadowCol=b.ember?'rgba(255,138,61,.50)':'rgba(242,207,122,.45)';
  g.save(); g.globalAlpha=a; g.textBaseline='middle';
  lines.forEach((ln,i)=>{
    const y=y0+i*lh+size*0.5;
    const idx = b.hi ? ln.indexOf(b.hi) : -1;
    g.font=font;
    if(idx>=0){
      const pre=ln.slice(0,idx), mid=b.hi, post=ln.slice(idx+b.hi.length);
      const wPre=g.measureText(pre).width, wMid=g.measureText(mid).width, wPost=g.measureText(post).width;
      let x=W/2-(wPre+wMid+wPost)/2;
      g.textAlign='left';
      g.fillStyle=CREAM; g.fillText(pre,x,y); x+=wPre;
      glow(shadowCol,30); g.fillStyle=col; g.fillText(mid,x,y); noglow(); x+=wMid;
      g.fillStyle=CREAM; g.fillText(post,x,y);
    } else { g.textAlign='center'; g.fillStyle=CREAM; g.fillText(ln,W/2,y) }
  });
  g.restore();
}

function header(t){
  const a=ease(prog(t,0.15,0.7))*0.85;
  g.save(); g.globalAlpha=a; g.textAlign='center'; g.textBaseline='middle';
  g.font='600 24px "IBM Plex Sans"'; g.letterSpacing='6px';
  g.fillStyle=MUTED; g.fillText('OLA ACCOUNTANCY',W/2,120); g.letterSpacing='0px';
  g.strokeStyle=BRASS; g.lineWidth=2; g.globalAlpha=a*0.8;
  g.beginPath(); g.moveTo(W/2-40,152); g.lineTo(W/2+40,152); g.stroke(); g.restore();
}

function endCard(t){
  const k=ease(prog(t,END.in,0.5)), bk=back(prog(t,END.in,0.7));
  if(k<=0.001)return;
  g.save(); g.globalAlpha=k;
  g.fillStyle='rgba(6,13,24,.95)'; g.fillRect(0,0,W,H);
  g.textAlign='center'; g.textBaseline='middle';
  g.font='700 70px "Bricolage Grotesque"'; g.fillStyle=CREAM;
  const ls=layout(END.line,'700 70px "Bricolage Grotesque"',880);
  ls.forEach((l,i)=>g.fillText(l,W/2,800+i*88));
  const y=1180+(1-bk)*50;
  const gr=g.createLinearGradient(140,y,940,y+170);
  gr.addColorStop(0,'#FBEBC8'); gr.addColorStop(1,BRASS2);
  g.fillStyle=gr; glow('rgba(214,169,73,.5)',40);
  g.beginPath(); g.roundRect(120,y,840,170,30); g.fill(); noglow();
  g.fillStyle=INK; g.font='600 26px "IBM Plex Sans"'; g.letterSpacing='3px';
  g.fillText('SCRIE-NE PE WHATSAPP',W/2+40,y+56); g.letterSpacing='0px';
  g.font='700 58px "Bricolage Grotesque"'; g.fillText('0330 1331 886',W/2+40,y+116);
  g.fillStyle=GREEN; g.beginPath(); g.arc(215,y+85,44,0,7); g.fill();
  g.fillStyle='#fff'; g.font='700 44px "IBM Plex Sans"'; g.fillText('✆',215,y+88);
  g.fillStyle=MUTED; g.font='400 26px "IBM Plex Sans"';
  g.fillText('Luton · Birmingham',W/2,y+232);
  g.restore();
}

window.seek=function(t){
  background(t);
  ghostScene(t);
  embers(t);
  vignette();
  BEATS.forEach(b=>drawBeat(b,t));
  if(END && END.in < TOTAL) endCard(t);
  header(t);
};
window.ready=document.fonts.ready;
</script></body></html>
