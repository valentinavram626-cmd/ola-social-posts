<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
html,body{margin:0;background:transparent;width:1080px;height:1920px;overflow:hidden}
canvas{display:block}
#w{position:absolute;left:-9999px;font-family:Anton}
#w b{font-family:"Bricolage Grotesque"}#w i{font-family:"IBM Plex Sans";font-style:normal}
</style></head><body><canvas id="c" width="1080" height="1920"></canvas>
<div id="w">ĂăȘșȚțÎîÂâ<b>ĂăȘșȚț£0123</b><i>ĂăȘșȚț</i></div>
<script>
const W=1080,H=1920, cv=document.getElementById('c'), g=cv.getContext('2d');
const CFG=__CFG__;
const TOTAL=CFG.total, BEATS=CFG.beats, HERO=CFG.hero||null, THEME=CFG.theme||'navy';

const PAL={
  navy:   {a:'#070B14', b:'#101C33', key:'#F2CF7A', key2:'#D6A949', light:'#8FB4FF'},
  ember:  {a:'#0B0705', b:'#2A150B', key:'#FFB46B', key2:'#FF8A3D', light:'#FFD9A8'},
  slate:  {a:'#07090B', b:'#161C22', key:'#9FE6C6', key2:'#59C79B', light:'#BFE9FF'},
  wine:   {a:'#0A0608', b:'#2A0F1B', key:'#F0A6B8', key2:'#D4607F', light:'#FFC9D6'}
}[CFG.theme||'navy'];

const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const prog=(t,s,d)=>clamp((t-s)/d);
const ease=x=>1-Math.pow(1-x,3);
const easeIO=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const over=x=>{const c=1.70158+1;return 1+c*Math.pow(x-1,3)+1.70158*Math.pow(x-1,2)};
function rnd(i){const x=Math.sin(i*127.1+i*i*311.7)*43758.5453;return x-Math.floor(x)}

// ---------- background: depth, a travelling light, grain ----------
function bg(t){
  const k=t/TOTAL;
  const base=g.createLinearGradient(0,0,W*0.4,H);
  base.addColorStop(0,PAL.b); base.addColorStop(.55,PAL.a); base.addColorStop(1,'#04060A');
  g.fillStyle=base; g.fillRect(0,0,W,H);

  // a soft light that travels across the frame — motion even when text is still
  const lx=W*(0.18+0.64*easeIO(k)), ly=H*(0.30+0.16*Math.sin(k*Math.PI*1.3));
  const lg=g.createRadialGradient(lx,ly,40,lx,ly,980);
  lg.addColorStop(0,'rgba(255,255,255,.16)');
  lg.addColorStop(.35,'rgba(143,180,255,.09)');
  lg.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=lg; g.fillRect(0,0,W,H);

  // second, counter-moving accent so the frame never reads flat
  const ax=W*(0.86-0.52*easeIO(k)), ay=H*(0.74-0.10*Math.cos(k*Math.PI));
  const ag=g.createRadialGradient(ax,ay,30,ax,ay,760);
  ag.addColorStop(0,hexA(PAL.key2,.17));
  ag.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=ag; g.fillRect(0,0,W,H);
}
function hexA(hex,a){
  const n=parseInt(hex.slice(1),16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}

// Bokeh field: big soft discs at varying depth. Radial gradients stand in for
// lens blur, which is what makes this read as footage rather than as a slide.
const ORBS=[];
for(let i=0;i<26;i++){
  ORBS.push({
    x: rnd(i*3+1), y: rnd(i*3+2), r: 40+rnd(i*3+3)*210,
    sp: 0.012+rnd(i*7+5)*0.045, ph: rnd(i*11+9)*6.283,
    a: 0.05+rnd(i*13+4)*0.22, warm: rnd(i*17+6)>0.45
  });
}
function bokeh(t){
  g.save();
  for(const o of ORBS){
    const drift=(t*o.sp+o.y)%1.25-0.125;
    const x=o.x*W+Math.sin(t*0.22+o.ph)*46;
    const y=H*1.08-drift*(H*1.18);
    if(y<-o.r||y>H+o.r)continue;
    const col=o.warm?PAL.key2:PAL.light;
    const rg=g.createRadialGradient(x,y,0,x,y,o.r);
    rg.addColorStop(0,hexA(col,o.a));
    rg.addColorStop(.55,hexA(col,o.a*0.42));
    rg.addColorStop(1,hexA(col,0));
    g.fillStyle=rg; g.beginPath(); g.arc(x,y,o.r,0,7); g.fill();
  }
  g.restore();
}

// a few sharp specks in front of the blur — gives the frame a focal plane
function motes(t){
  g.save();
  for(let i=0;i<22;i++){
    const sp=0.05+rnd(i)*0.09;
    const life=(t*sp+rnd(i+41))%1;
    const x=rnd(i+7)*W+Math.sin(t*0.55+i)*42;
    const y=H*1.05-life*(H*1.15);
    const r=1.1+rnd(i+53)*2.2;
    const a=Math.sin(Math.PI*life)*0.5;
    if(a<=.01)continue;
    g.globalAlpha=a; g.fillStyle='#FFFFFF';
    g.shadowColor=hexA(PAL.light,.8); g.shadowBlur=10;
    g.beginPath(); g.arc(x,y,r,0,7); g.fill();
  }
  g.shadowBlur=0; g.restore();
}

function vignette(){
  const v=g.createRadialGradient(W/2,H*0.48,420,W/2,H*0.48,1200);
  v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,0,.70)');
  g.fillStyle=v; g.fillRect(0,0,W,H);
}

// film grain — the cheapest way to stop canvas looking like a slide
let grainCanvas=null;
function grain(t){
  if(!grainCanvas){
    grainCanvas=document.createElement('canvas');
    grainCanvas.width=270; grainCanvas.height=480;
  }
  const gc=grainCanvas.getContext('2d');
  const img=gc.createImageData(270,480);
  const d=img.data, seed=Math.floor(t*24);
  for(let i=0;i<d.length;i+=4){
    const v=((Math.sin((i*12.9898+seed*78.233))*43758.5453)%1+1)%1;
    const n=128+(v-0.5)*84;
    d[i]=d[i+1]=d[i+2]=n; d[i+3]=20;
  }
  gc.putImageData(img,0,0);
  g.save(); g.globalCompositeOperation='overlay'; g.globalAlpha=.5;
  g.imageSmoothingEnabled=true;
  g.drawImage(grainCanvas,0,0,W,H); g.restore();
}

// ---------- captions, styled to the reference ----------
function layout(txt,font,maxW){
  g.font=font; const words=txt.split(' '); const lines=[]; let cur='';
  for(const w of words){const test=cur?cur+' '+w:w;
    if(g.measureText(test).width>maxW&&cur){lines.push(cur);cur=w}else cur=test}
  if(cur)lines.push(cur); return lines;
}
function caption(b,t){
  const a=ease(prog(t,b.in,0.22))*(1-ease(prog(t,b.out,0.18)));
  if(a<=.002)return;
  const size=b.size||70, lh=size*1.08;
  const font=`${size}px Anton`;
  const lines=layout(b.text.toUpperCase(),font,900);
  const blockH=lines.length*lh;
  // reference sits the caption band at about 62% of frame height
  const y0=H*0.62-blockH/2;
  const pop=1+0.035*(1-ease(prog(t,b.in,0.3)));
  g.save(); g.globalAlpha=a;
  g.translate(W/2,y0+blockH/2); g.scale(pop,pop); g.translate(-W/2,-(y0+blockH/2));
  g.textAlign='center'; g.textBaseline='middle'; g.font=font;
  lines.forEach((ln,i)=>{
    const y=y0+i*lh+lh/2;
    const hi=b.hi?ln.indexOf(b.hi.toUpperCase()):-1;
    // hard outline so it survives any background, exactly like the reference
    g.lineJoin='round'; g.lineWidth=size*0.17; g.strokeStyle='rgba(4,6,10,.92)';
    g.strokeText(ln,W/2,y);
    if(hi>=0){
      const pre=ln.slice(0,hi), mid=b.hi.toUpperCase(), post=ln.slice(hi+mid.length);
      const wp=g.measureText(pre).width, wm=g.measureText(mid).width, ws=g.measureText(post).width;
      let x=W/2-(wp+wm+ws)/2; g.textAlign='left';
      g.fillStyle='#FFFFFF'; g.fillText(pre,x,y); x+=wp;
      g.fillStyle=PAL.key;   g.fillText(mid,x,y); x+=wm;
      g.fillStyle='#FFFFFF'; g.fillText(post,x,y);
      g.textAlign='center';
    } else { g.fillStyle='#FFFFFF'; g.fillText(ln,W/2,y) }
  });
  g.restore();
}

// ---------- the figure: lands with weight, sits above the caption ----------
function hero(t){
  if(!HERO)return;
  const a=ease(prog(t,HERO.in,0.3))*(1-ease(prog(t,HERO.out,0.3)));
  if(a<=.002)return;
  const k=over(prog(t,HERO.in,0.55));
  const size=HERO.size||210;
  g.save(); g.globalAlpha=a;
  g.textAlign='center'; g.textBaseline='middle';
  const y=H*0.40, sc=0.86+0.14*k;
  g.translate(W/2,y); g.scale(sc,sc); g.translate(-W/2,-y);
  g.font=`800 ${size}px "Bricolage Grotesque"`;
  g.shadowColor=hexA(PAL.key2,.45); g.shadowBlur=60;
  g.fillStyle=PAL.key; g.fillText(HERO.text,W/2,y);
  g.shadowBlur=0;
  if(HERO.sub){
    g.font='600 30px "IBM Plex Sans"'; g.letterSpacing='7px';
    g.fillStyle='rgba(255,255,255,.62)';
    g.fillText(HERO.sub.toUpperCase(),W/2,y+size*0.66);
    g.letterSpacing='0px';
  }
  g.restore();
}

// ---------- the whole composition drifts slowly: never a still frame ----------
// Three render modes, so one set of timings drives every layer of a clip:
//   full     - background and type together
//   bgonly   - background only, where footage is not playing
//   textonly - transparent captions, to sit over footage
const MODE=CFG.mode||'full';
window.seek=function(t){
  const k=t/TOTAL;
  g.setTransform(1,0,0,1,0,0);
  g.clearRect(0,0,W,H);
  const push=1.0+0.055*easeIO(k);              // slow, continuous push-in
  const dx=(1-push)*W/2, dy=(1-push)*H*0.52;
  g.save(); g.setTransform(push,0,0,push,dx,dy);
  if(MODE!=='textonly'){ bg(t); bokeh(t); motes(t); vignette(); }
  if(MODE!=='bgonly'){ hero(t); BEATS.forEach(b=>caption(b,t)); }
  g.restore();
  if(MODE!=='textonly') grain(t);
};
window.ready=document.fonts.ready;
</script></body></html>
